[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "winui-mcp-server"
version = "0.2.0"
description = "MCP server for Windows UI Automation — control any Windows app from AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "uiautomation",
]

[project.scripts]
winui-mcp = "winui_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["winui_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/winui_mcp",
    "/README.md",
    "/README.cn.md",
    "/LICENSE",
    "/pyproject.toml",
]
